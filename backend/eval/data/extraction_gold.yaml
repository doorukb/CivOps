# Extraction-accuracy gold set: 40 short synthetic calls with hand-written labels.
#
# Every transcript is fictional (synthetic: true).
#
# PRE-REGISTRATION. Cases and labels were written and committed before any
# paid run. Do not edit a case or a label after results exist; start a v2 file.
# If you believe a label is wrong, say so in docs/EVALUATION.md and report
# results with and without that case. Do not quietly fix it.
#
# What is scored. The output of the whole extraction pipeline (the model, then
# the evidence check, then the hedge check), because that is what the rulebook
# receives. Fields: call_type, the four screening answers, caller_requests_cress.
#
# Labelling rules (each label was written by hand against these rules):
#   true   the caller states it plainly.
#   false  the caller denies it plainly, with no hedge.
#   null   the question was not asked, was not answered, was answered with a
#          hedge ("I don't think so", "not that I know of", "I haven't seen
#          any"), or only the dispatcher said the words.
#   A dispatcher's question or assumption is never evidence of anything.
#
# call_type may be a list when the prompt's definitions fit more than one label
# (an injured person is both "a person's condition" and arguably "other");
# any label in the list counts as correct.
#
# call_type follows the definitions in the extractor prompt:
#   wellbeing_check  concern about a person's welfare or condition
#   disturbance      arguments, confrontations, disputes or disruptive behaviour
#   suspicious       concerning or unusual activity without a described confrontation
#   noise_complaint  excessive noise without a described interpersonal confrontation
#   other            none of the above
#
# Categories:
#   plain        every question asked and plainly denied
#   hedge        one answer is a hedged denial (the negation trap)
#   question     the dispatcher says the scary words, the caller does not answer
#   positive     the caller plainly reports a concern
#   unlabelled   no speaker labels (how live-microphone text arrives)
#   partial      only some questions are asked
#   request      the caller asks for, refuses, or merely mentions community responders
#
# Scenarios are written so that only the labelled answers are in play. A case
# where an unlabelled field is arguably true would make the gold arguable.

synthetic: true
version: 1
preregistered: "2026-11-16"

cases:
  # ---------------------------------------------------------------- plain
  - id: plain_wellbeing_request
    category: plain
    lines:
      - [dispatcher, "This call is a simulation and is being recorded. How can I help?"]
      - [caller, "My uncle lives alone and he has not answered his phone since Sunday."]
      - [dispatcher, "Are there any weapons involved?"]
      - [caller, "No, there are no weapons."]
      - [dispatcher, "Has anyone been violent or threatened anyone?"]
      - [caller, "No, nobody has been violent and nobody has threatened anyone."]
      - [dispatcher, "Is anyone injured?"]
      - [caller, "No, nobody is injured."]
      - [dispatcher, "Is anyone in immediate danger?"]
      - [caller, "No, nobody is in immediate danger."]
      - [caller, "Could you send the community responders to check on him?"]
    gold: {call_type: wellbeing_check, weapon_present: false, violence: false, injury: false, immediate_danger: false, caller_requests_cress: true}

