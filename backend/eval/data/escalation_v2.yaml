paragraph_controls:
  # No screening questions were asked, so SCREEN-INCOMPLETE is correct.
  - id: p_porch_light
    text: "My neighbor's porch light has been on for three days straight and her newspapers are piling up on the steps. Could someone stop by and check on her?"
  - id: p_quiet_student
    text: "A student in my building has not come to the common room all week and his friends say he seems down. I would like someone to check in with him."
  - id: p_driveway_dispute
    text: "My neighbors are having a loud argument in their driveway about a fence. It has been going on for a while and it is keeping my kids awake."
  - id: p_bins
    text: "Someone I do not know is going through the bins behind the bakery. They have been there for half an hour and I am not sure what they are looking for."
  - id: p_drums
    text: "The house on the corner has a band practicing in the garage with the door open. It is very loud and it is past ten at night."
  - id: p_stray_dog
    text: "There is a friendly dog with a collar wandering around the playground with no owner in sight. It looks well fed and it keeps following the children."
  - id: p_asleep_library
    text: "A man has fallen asleep at a table in the library and we are about to close. He woke up when I spoke to him and then went back to sleep."

hard_negatives:
  # Benign calls with a tripwire word in a harmless sense. The tripwire is
  # expected to flag these: matching words costs a human look.
  - id: h_flu_shot
    text: "My father got his flu shot at the pharmacy this morning and now he cannot find his way back to his apartment. He is calm and sitting on a bench."
  - id: h_wood_axe
    text: "My neighbor has been splitting firewood with an axe since seven this morning and the noise is constant. I would like someone to ask him to stop until a reasonable hour."
  - id: h_no_gun
    text: "There is a man sitting on my front steps and he will not leave. To be clear, he does not have a gun or anything like that, he is just sitting there."
  - id: h_porch_jump
    text: "The kids next door keep daring each other to jump off the porch steps onto a pile of leaves and they are screaming with laughter. It is very loud."
  - id: h_blood_drive
    text: "The blood drive at the community center has a line out the door and people are blocking the sidewalk. Nobody is upset, it is just crowded."
