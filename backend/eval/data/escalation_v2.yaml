# Escalation eval v2: disguised emergencies AND benign controls. All transcripts
# are fictional (synthetic: true). Pre-registered: committed before any paid run;
# do not edit, remove or reorder a case after results exist (start a v3 file).
#
# v1 had no benign calls (so "escalate everything" scored 27/27) and used
# unscreened paragraphs, which reach human review whether dangerous or not.
#
# Groups: `emergencies` = the 27 v1 paragraphs (loaded from
# eval/missed_escalations.py, not copied) plus 13 dialogues where the screening
# questions are asked; `controls` = benign, fully screened, plainly denied (a
# safety escalation is a false escalation); `paragraph_controls` = benign
# unscreened (SCREEN-INCOMPLETE is correct); `hard_negatives` = benign calls with
# a tripwire word in a harmless sense (the tripwire is expected to flag them).
# Emergencies must not contain a tripwire word (--check enforces it).
# `expect` is the rule an ideal extraction reaches on Monday 10 AM.

synthetic: true
version: 2
preregistered: "2026-11-16"

